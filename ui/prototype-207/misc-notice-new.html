<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>নতুন নোটিশ — Prototype 207</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#131313', 'ink-card': '#1c1c1c', paper: '#ffffff', 'paper-muted': '#f4f4f6',
          line: '#ececec', 'line-strong': '#d8d8d8', muted: '#767676',
          brand: { 50: '#f1eefe', 100: '#e3dcfd', 300: '#b3a4f7', 500: '#6d4dfb', 600: '#5a37e8', 700: '#4826c4' },
          mint: { DEFAULT: '#00d26a', deep: '#0a7a48', soft: '#e6f9ef' },
          sun: { DEFAULT: '#ffc94a', deep: '#c98a00', soft: '#fff6e0' },
          alert: { DEFAULT: '#ef4444', deep: '#dc2626', soft: '#fdeaea' },
          sky: { DEFAULT: '#00b2ff', deep: '#0077b8', soft: '#e5f6ff' },
        },
        borderRadius: { sm: '8px', md: '14px', lg: '20px' },
        boxShadow: { card: '0 12px 32px rgb(0 0 0 / 0.08)' },
        fontFamily: { sans: ["'Plus Jakarta Sans'", "'Hind Siliguri'", 'system-ui', 'sans-serif'] },
      },
    },
  }
</script>
<style>body { background: #f4f4f6; color: #131313; font-family: 'Plus Jakarta Sans', 'Hind Siliguri', system-ui, sans-serif; }</style>
</head>
<body class="min-h-screen">

<div class="sticky top-0 z-50 bg-ink text-white text-xs font-semibold px-4 py-2">
  🧪 THROWAWAY PROTOTYPE — map #207 · ticket <a href="https://github.com/salmansrizon/Amar_school_LMS/issues/220" class="underline">#220 Institute/Notices/SMS/misc</a> — Notice create form: one Card (Pattern B "form"), full-width field grid, conditional class/section pickers and action row kept.
</div>

<main class="mx-auto w-full max-w-3xl flex-1 p-6">
  <div class="mb-4 flex items-center justify-between">
    <h1 class="text-2xl font-extrabold">নতুন তৈরি করুন</h1>
    <a href="#" aria-label="ফিরে যান" class="inline-flex size-9 shrink-0 items-center justify-center rounded-full text-brand-600 transition hover:bg-brand-50">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5"><path d="m15 18-6-6 6-6" /></svg>
    </a>
  </div>

  <nav class="mb-5 flex gap-1 border-b border-line text-sm font-semibold">
    <a href="misc-notices-list.html" class="rounded-t-md px-4 py-2 text-muted hover:bg-paper hover:text-ink">তালিকা</a>
    <span class="rounded-t-md border-b-2 border-brand-600 px-4 py-2 text-ink">নতুন তৈরি</span>
    <a href="misc-notices-gallery.html" class="rounded-t-md px-4 py-2 text-muted hover:bg-paper hover:text-ink">গ্যালারি</a>
  </nav>

  <!-- Pattern B: Form -> one Card, full-width field grid, action row at foot -->
  <section class="rounded-2xl border border-line bg-paper p-5 shadow-card">
    <form class="grid gap-4 sm:grid-cols-2">
      <div>
        <label class="mb-1 block text-xs font-semibold text-muted">ধরন</label>
        <select class="h-10 w-full rounded-md border border-line-strong bg-paper px-3 text-sm outline-none focus:border-brand-500">
          <option>নোটিশ</option>
          <option>হোমওয়ার্ক</option>
          <option>পাঠ পরিকল্পনা</option>
          <option>দৈনিক পাঠ</option>
          <option>পরীক্ষার প্রস্তুতি</option>
        </select>
      </div>
      <div>
        <label class="mb-1 block text-xs font-semibold text-muted">গুরুত্ব</label>
        <select class="h-10 w-full rounded-md border border-line-strong bg-paper px-3 text-sm outline-none focus:border-brand-500">
          <option>সাধারণ</option>
          <option>গুরুত্বপূর্ণ</option>
          <option>জরুরি</option>
        </select>
      </div>
      <div class="sm:col-span-2">
        <label class="mb-1 block text-xs font-semibold text-muted">শিরোনাম</label>
        <input required class="h-10 w-full rounded-md border border-line-strong bg-paper px-3 text-sm outline-none focus:border-brand-500" placeholder="যেমনঃ অর্ধ-বার্ষিক পরীক্ষার সময়সূচী প্রকাশ" />
      </div>
      <div>
        <label class="mb-1 block text-xs font-semibold text-muted">লক্ষ্য শ্রোতা</label>
        <select class="h-10 w-full rounded-md border border-line-strong bg-paper px-3 text-sm outline-none focus:border-brand-500">
          <option>সকলে</option>
          <option selected>নির্দিষ্ট শ্রেণি/শাখা</option>
        </select>
      </div>
      <div></div>
      <div class="grid gap-4 sm:col-span-2 sm:grid-cols-3">
        <div>
          <label class="mb-1 block text-xs font-semibold text-muted">শ্রেণি</label>
          <select class="h-10 w-full rounded-md border border-line-strong bg-paper px-3 text-sm outline-none focus:border-brand-500">
            <option>নবম শ্রেণি</option>
            <option>দশম শ্রেণি</option>
          </select>
        </div>
        <div>
          <label class="mb-1 block text-xs font-semibold text-muted">শাখা</label>
          <select class="h-10 w-full rounded-md border border-line-strong bg-paper px-3 text-sm outline-none focus:border-brand-500">
            <option>ক</option>
            <option>খ</option>
          </select>
        </div>
      </div>
      <div class="sm:col-span-2">
        <label class="mb-1 block text-xs font-semibold text-muted">বিষয়বস্তু</label>
        <textarea rows="5" class="w-full rounded-sm border border-line-strong bg-paper px-3 py-2 text-sm outline-none focus:border-brand-500" placeholder="বিস্তারিত লিখুন…"></textarea>
      </div>
      <div>
        <label class="mb-1 block text-xs font-semibold text-muted">ছবি</label>
        <input type="file" class="text-sm" />
      </div>
      <div>
        <label class="mb-1 block text-xs font-semibold text-muted">লিংক</label>
        <input class="h-10 w-full rounded-md border border-line-strong bg-paper px-3 text-sm outline-none focus:border-brand-500" placeholder="https://" />
      </div>
      <div class="flex gap-2 sm:col-span-2">
        <button type="submit" class="rounded-full bg-brand-600 px-6 py-2 text-sm font-semibold text-white hover:bg-brand-700">প্রকাশ করুন</button>
      </div>
    </form>
  </section>
</main>
</body>
</html>
